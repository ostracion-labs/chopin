name: chopin-workspace

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "127.0.0.1:55432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - workspace-postgres:/var/lib/postgresql/data

volumes:
  workspace-postgres:
